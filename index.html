<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Month Stayz Thailand — Project Hub</title>

  <!-- Tabler icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    /* Inline logo for sidebar — base64 embedded below via JS */
    #sidebar-logo-img { object-fit: cover; }
  </style>
</head>
<body>

<!-- ── Login screen ─────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <img id="login-logo" class="login-logo" src="" alt="Month Stayz Thailand logo">
    <div class="login-brand">Month Stayz Thailand</div>
    <div class="login-sub">by Gold Star Empire</div>
    <h2>Sign in to Project Hub</h2>
    <p>Choose your profile to continue</p>

    <div class="team-members-grid" id="member-grid">
      <!-- populated by JS -->
    </div>

    <div class="login-divider"><span>or enter your name</span></div>

    <div class="form-group">
      <label>Your name</label>
      <input type="text" id="login-name" placeholder="Enter your name">
    </div>
    <button class="btn-login" onclick="doLogin()">Enter workspace</button>
  </div>
</div>

<!-- ── Main app (hidden until login) ────────────────────────── -->
<div id="app" style="display:none">

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img id="sidebar-logo-img" src="" alt="logo">
      <div class="sidebar-logo-text">
        <div class="brand">Month Stayz</div>
        <div class="sub">Thailand · Project Hub</div>
      </div>
    </div>

    <div class="sidebar-user" id="sidebar-user">
      <div id="user-av"></div>
      <div class="sidebar-user-info">
        <div class="name" id="user-name-display">—</div>
        <div class="role" id="user-role-display">—</div>
      </div>
      <div class="online-dot" title="Online"></div>
    </div>

    <div style="overflow-y:auto;flex:1">
      <div class="sb-section">Views</div>
      <div class="sb-item" id="nav-board" onclick="setView('board')">
        <i class="ti ti-layout-kanban"></i><span>Board</span>
      </div>
      <div class="sb-item" id="nav-list" onclick="setView('list')">
        <i class="ti ti-list"></i><span>List</span>
      </div>
      <div class="sb-item" id="nav-dash" onclick="setView('dashboard')">
        <i class="ti ti-chart-bar"></i><span>Dashboard</span>
      </div>

      <div class="sb-section">Projects</div>
      <div id="project-list"><!-- populated by renderSidebar --></div>
      <div class="sb-item" onclick="openAddProject()">
        <i class="ti ti-folder-plus"></i><span>New project</span>
      </div>

      <div class="sb-section">Quick filters</div>
      <div class="sb-item" onclick="filterMyTasks()">
        <i class="ti ti-user-check"></i><span>My tasks</span>
      </div>
      <div class="sb-item" onclick="filterUrgent()">
        <i class="ti ti-flame"></i><span>Urgent</span>
        <span class="sb-badge" id="urgent-count">0</span>
      </div>
      <div class="sb-item" onclick="filterDueSoon()">
        <i class="ti ti-clock"></i><span>Due soon</span>
      </div>
    </div>

    <div class="sidebar-bottom">
      <div class="sb-team-label">Team online</div>
      <div id="team-list"><!-- populated by renderSidebar --></div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="proj-title">
        Villa Operations
        <span id="proj-task-count"></span>
      </div>

      <div class="view-tabs">
        <div class="vtab" id="tab-board" onclick="setView('board')">
          <i class="ti ti-layout-kanban"></i> Board
        </div>
        <div class="vtab" id="tab-list" onclick="setView('list')">
          <i class="ti ti-list"></i> List
        </div>
        <div class="vtab" id="tab-dash" onclick="setView('dashboard')">
          <i class="ti ti-chart-bar"></i> Dashboard
        </div>
      </div>

      <button class="btn" onclick="openFilterMenu()" title="Filter tasks">
        <i class="ti ti-filter"></i> Filter
      </button>
      <button class="btn btn-primary" onclick="openAddTask()">
        <i class="ti ti-plus"></i> Add task
      </button>
    </div>

    <div class="content-area" id="content">
      <!-- Views rendered here -->
    </div>
  </div>

</div><!-- end #app -->

<!-- Scripts -->
<script src="app.js"></script>
<script src="views.js"></script>
<script src="taskDetail.js"></script>
<script>

// ── Embed logo ───────────────────────────────────────────────
// Logo base64 is loaded from a separate fetch to avoid blocking
const LOGO_B64_PLACEHOLDER = '__LOGO_B64__';

// ── Login ────────────────────────────────────────────────────
function initLogin() {
  // Populate member grid
  const grid = document.getElementById('member-grid');
  grid.innerHTML = MEMBERS.map(m => `
  <div class="team-member-btn" onclick="selectMember('${m.id}',this)">
    <div class="av" style="width:32px;height:32px;font-size:12px;background:${m.bg};color:${m.color}">${m.initials}</div>
    <div>
      <div style="font-size:12px;font-weight:600;color:var(--text-primary)">${m.name}</div>
      <div style="font-size:11px;color:var(--text-muted)">${m.role}</div>
    </div>
  </div>`).join('');
}

function selectMember(id, el) {
  document.querySelectorAll('.team-member-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const m = getMember(id);
  document.getElementById('login-name').value = m.name;
  STATE.currentUser = id;
  STATE.composerMember = id;
}

function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  if (!name) { alert('Please select a team member or enter your name'); return; }

  let memberId = STATE.currentUser;
  if (!memberId) {
    // Try matching name
    const found = MEMBERS.find(m => m.name.toLowerCase() === name.toLowerCase());
    memberId = found ? found.id : 'YOU';
  }

  STATE.currentUser = memberId;
  STATE.composerMember = memberId;

  // Update sidebar user display
  const m = getMember(memberId);
  document.getElementById('user-av').innerHTML = `<div class="av" style="width:28px;height:28px;font-size:11px;background:${m.bg};color:${m.color}">${m.initials}</div>`;
  document.getElementById('user-name-display').textContent = m.name;
  document.getElementById('user-role-display').textContent = m.role;

  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  renderSidebar();
  setView('board');
}

// ── Sidebar rendering ────────────────────────────────────────
function renderSidebar() {
  // Projects
  const projList = document.getElementById('project-list');
  projList.innerHTML = PROJECTS.map(p => `
  <div class="sb-item${p.name === STATE.currentProject ? ' active' : ''}"
       onclick="setProject('${p.name}')">
    <span class="proj-dot" style="background:${p.color}"></span>
    <span>${p.name}</span>
    <span class="sb-badge">${tasks.filter(t => t.project === p.name).length}</span>
  </div>`).join('');

  // Team
  const teamList = document.getElementById('team-list');
  const onlineStatuses = { YOU: true, TM1: true, TM2: true, TM3: false, TM4: true, TM5: false };
  teamList.innerHTML = MEMBERS.map(m => `
  <div class="sb-member">
    <div class="av" style="width:24px;height:24px;font-size:9px;background:${m.bg};color:${m.color}">${m.initials}</div>
    <span class="name">${m.name.split(' ')[0]}</span>
    <div class="online" style="background:${onlineStatuses[m.id] ? '#4CAF50' : '#9E7B68'}"></div>
  </div>`).join('');

  // Nav highlights
  const urgentCount = tasks.filter(t => t.project === STATE.currentProject && t.priority === 'Urgent').length;
  const urgentEl = document.getElementById('urgent-count');
  if (urgentEl) urgentEl.textContent = urgentCount;

  // Project count in topbar
  const pt = getProjTasks();
  const titleEl = document.getElementById('proj-title');
  if (titleEl) {
    titleEl.innerHTML = `${STATE.currentProject} <span>${pt.length} tasks</span>`;
  }
}

// ── View switching ───────────────────────────────────────────
function setView(v) {
  STATE.currentView = v;
  ['board', 'list', 'dash'].forEach(k => {
    const tab = document.getElementById('tab-' + k);
    const nav = document.getElementById('nav-' + k);
    const active = (k === v || (k === 'dash' && v === 'dashboard'));
    if (tab) tab.classList.toggle('active', active);
    if (nav) nav.classList.toggle('active', active);
  });
  render();
}

// ── Project switching ────────────────────────────────────────
function setProject(name) {
  STATE.currentProject = name;
  renderSidebar();
  render();
}

// ── Quick filters ────────────────────────────────────────────
function filterMyTasks() {
  const uid = STATE.currentUser;
  const myTasks = tasks.filter(t => t.assignee === uid);
  if (!myTasks.length) { toast('No tasks assigned to you'); return; }
  // Switch to list view filtered
  STATE.currentView = 'list';
  setView('list');
  const content = document.getElementById('content');
  // Temporarily override to show all projects' tasks for current user
  const saved = STATE.currentProject;
  let html = `<div style="margin-bottom:12px;font-size:13px;font-weight:600;color:var(--text-secondary)">
    <i class="ti ti-user-check" style="color:var(--brand-orange)"></i>
    My tasks across all projects (${myTasks.length})
    <button class="btn btn-xs" style="margin-left:8px" onclick="setProject('${saved}')">Back to project</button>
  </div>
  <div class="list-table">
    <div class="list-header"><span>Task</span><span>Project</span><span>Status</span><span>Priority</span><span>Due</span><span></span></div>`;
  myTasks.forEach(t => {
    html += `<div class="list-row" onclick="openTask(${t.id})">
      <span class="list-task-title">${t.title}</span>
      <span style="font-size:12px;color:var(--text-muted)">${t.project}</span>
      <span>${statusPill(t.status)}</span>
      <span>${priorityBadge(t.priority)}</span>
      <span style="font-size:12px;color:var(--text-muted)">${t.due}</span>
      <span></span>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function filterUrgent() {
  const urgent = tasks.filter(t => t.priority === 'Urgent');
  if (!urgent.length) { toast('No urgent tasks right now'); return; }
  STATE.currentView = 'list';
  setView('list');
  const content = document.getElementById('content');
  let html = `<div style="margin-bottom:12px;font-size:13px;font-weight:600;color:var(--urgent-text)">
    <i class="ti ti-flame"></i> Urgent tasks (${urgent.length})
    <button class="btn btn-xs" style="margin-left:8px" onclick="render()">Back</button>
  </div>
  <div class="list-table">
    <div class="list-header"><span>Task</span><span>Project</span><span>Status</span><span>Assignee</span><span>Due</span><span></span></div>`;
  urgent.forEach(t => {
    const m = getMember(t.assignee);
    html += `<div class="list-row" onclick="openTask(${t.id})">
      <span class="list-task-title">${t.title}</span>
      <span style="font-size:12px;color:var(--text-muted)">${t.project}</span>
      <span>${statusPill(t.status)}</span>
      <span style="display:flex;align-items:center;gap:5px">${avatarHtml(t.assignee,20)}<span style="font-size:12px">${m.name.split(' ')[0]}</span></span>
      <span style="font-size:12px;color:var(--text-muted)">${t.due}</span>
      <span></span>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function filterDueSoon() {
  // Tasks due within Jun 10–16 window (simulated "this week")
  const soon = tasks.filter(t => {
    const day = parseInt(t.due.replace('Jun ', '')) || 99;
    return day <= 16 && t.status !== 'Done';
  });
  if (!soon.length) { toast('No tasks due soon'); return; }
  STATE.currentView = 'list';
  setView('list');
  const content = document.getElementById('content');
  let html = `<div style="margin-bottom:12px;font-size:13px;font-weight:600;color:var(--text-secondary)">
    <i class="ti ti-clock" style="color:var(--brand-orange)"></i> Due soon — this week (${soon.length} tasks)
    <button class="btn btn-xs" style="margin-left:8px" onclick="render()">Back</button>
  </div>
  <div class="list-table">
    <div class="list-header"><span>Task</span><span>Project</span><span>Status</span><span>Assignee</span><span>Due</span><span></span></div>`;
  soon.forEach(t => {
    const m = getMember(t.assignee);
    html += `<div class="list-row" onclick="openTask(${t.id})">
      <span class="list-task-title">${t.title}</span>
      <span style="font-size:12px;color:var(--text-muted)">${t.project}</span>
      <span>${statusPill(t.status)}</span>
      <span style="display:flex;align-items:center;gap:5px">${avatarHtml(t.assignee,20)}<span style="font-size:12px">${m.name.split(' ')[0]}</span></span>
      <span style="font-size:12px;color:var(--brand-orange);font-weight:600">${t.due}</span>
      <span></span>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
}

function openFilterMenu() {
  showModal(`
  <div class="modal-header">
    <h3><i class="ti ti-filter" style="color:var(--brand-orange);margin-right:6px"></i>Filter tasks</h3>
    <button class="btn btn-icon btn-sm" onclick="closeModal()"><i class="ti ti-x"></i></button>
  </div>
  <div class="modal-body">
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn" style="justify-content:flex-start" onclick="filterMyTasks();closeModal()"><i class="ti ti-user-check"></i> My tasks</button>
      <button class="btn" style="justify-content:flex-start" onclick="filterUrgent();closeModal()"><i class="ti ti-flame"></i> Urgent tasks only</button>
      <button class="btn" style="justify-content:flex-start" onclick="filterDueSoon();closeModal()"><i class="ti ti-clock"></i> Due this week</button>
      <hr class="divider">
      <button class="btn" style="justify-content:flex-start" onclick="render();closeModal()"><i class="ti ti-refresh"></i> Clear filters</button>
    </div>
  </div>`);
}

// ── Bootstrap ────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Load and embed logo into both login and sidebar
  fetch('assets/logo_small.png')
    .then(r => r.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      document.getElementById('login-logo').src = url;
      document.getElementById('sidebar-logo-img').src = url;
    })
    .catch(() => {
      // Fallback: use a text-only logo
      document.getElementById('login-logo').style.display = 'none';
    });

  initLogin();
  // Keyboard shortcut: Escape closes detail panel
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.getElementById('detail-overlay')) { closeDetail(); return; }
      if (document.getElementById('modal-overlay')?.style.display !== 'none') { closeModal(); }
    }
  });
});

// Expose globals needed by inline onclick handlers
window.setView = setView;
window.setProject = setProject;
window.renderSidebar = renderSidebar;
window.filterMyTasks = filterMyTasks;
window.filterUrgent = filterUrgent;
window.filterDueSoon = filterDueSoon;
window.openFilterMenu = openFilterMenu;
window.doLogin = doLogin;
window.selectMember = selectMember;
</script>

</body>
</html>
